# Optional gateway request budget. Starts in observation mode and must not be
# enabled for blocking until the host proxy's X-Forwarded-For policy is checked.
services:
  gateway:
    volumes:
      - ./nginx/rate-limit.conf.template:/etc/nginx/templates/99-rate-limit.conf.template:ro
    environment:
      SIMERT_RATE_LIMIT_RATE: ${SIMERT_RATE_LIMIT_RATE:-30r/s}
      SIMERT_RATE_LIMIT_BURST: ${SIMERT_RATE_LIMIT_BURST:-60}
      SIMERT_RATE_LIMIT_DRY_RUN: ${SIMERT_RATE_LIMIT_DRY_RUN:-on}
      SIMERT_RATE_LIMIT_ALLOWED_ORIGIN: ${SIMERT_RATE_LIMIT_ALLOWED_ORIGIN:-http://181.113.129.20}

  # Only the paid-obligations read query (a POST in GIM's API) opts in.
  # Financial write requests are never automatically retried.
  simert-0:
    environment:
      GIM_READ_RESILIENCE_ENABLED: ${GIM_READ_RESILIENCE_ENABLED:-false}
      GIM_READ_TIMEOUT_MS: ${GIM_READ_TIMEOUT_MS:-20000}
      GIM_READ_MAX_RETRIES: ${GIM_READ_MAX_RETRIES:-1}
      GIM_READ_RETRY_DELAY_MS: ${GIM_READ_RETRY_DELAY_MS:-200}
      GIM_READ_CIRCUIT_FAILURES: ${GIM_READ_CIRCUIT_FAILURES:-3}
      GIM_READ_CIRCUIT_RESET_MS: ${GIM_READ_CIRCUIT_RESET_MS:-30000}
