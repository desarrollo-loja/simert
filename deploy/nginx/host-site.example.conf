# Plantilla para el nginx DEL HOST (no es del stack: el gateway de Docker tiene
# su propia configuracion en gateway.conf.template).
#
# Solo cambia una cosa respecto a lo que tienes hoy: el bloque que sirve el
# front deja de leer archivos de disco y pasa a hacer proxy al contenedor.
# El bloque /api NO se toca — sigue apuntando a 127.0.0.1:3000-3003, que es
# donde publica el gateway, los mismos puertos que usa PM2 hoy.
#
# Para ver tu configuracion actual y localizar el bloque a cambiar:
#   sudo nginx -T | grep -nE "server_name|root|location"
#
# Despues de editar:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;            # <-- pon aqui tu server_name real

    # ---------------------------------------------------------------------
    # FRONT
    #
    # ANTES (servia los archivos subidos a mano):
    #
    #   location / {
    #       root  /ruta/al/dist;
    #       index index.html;
    #   }
    #
    # AHORA: proxy al contenedor simert-web.
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El contenedor ya manda las cabeceras de cache correctas:
        # index.html con no-store y los assets con immutable a un ano.
        # No las sobreescribas aqui o pierdes el refresco automatico tras
        # cada despliegue.
    }

    # ---------------------------------------------------------------------
    # API — este bloque se queda EXACTAMENTE como esta hoy.
    #
    # nginx elige por prefijo mas largo, asi que /api gana sobre / aunque
    # este declarado despues.
    #
    # Los puertos no cambian al migrar a Docker: el gateway del stack publica
    # en 127.0.0.1:3000-3003, los mismos que ocupa PM2. Por eso el gateway es
    # lo ultimo que se levanta.
    # ---------------------------------------------------------------------
    #
    # location /api/auth/   { proxy_pass http://127.0.0.1:3000/; ... }
    # location /api/pay/    { proxy_pass http://127.0.0.1:3001/; ... }
    # location /api/simert/ { proxy_pass http://127.0.0.1:3002/; ... }
    # location /socket.io/  { proxy_pass http://127.0.0.1:3003;  ... }
    #
    # (Deja los tuyos tal cual: estos son solo un recordatorio del mapeo.)
}
