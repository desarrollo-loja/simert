# El login puede devolver un JWT renovado en X-Token. El primer buffer de
# respuesta se usa aun cuando el proxy de la imagen tenga buffering off.
proxy_buffer_size 64k;
proxy_buffers 4 64k;
proxy_busy_buffers_size 128k;

# Diagnostico temporal de respuestas 403: si el upstream respondio, nginx
# expone su codigo aqui; si el propio WAF rechazo la solicitud, queda vacio.
# No registra cuerpos, contrasenas ni tokens. Retirar tras ajustar el WAF.
add_header X-Simert-WAF-Hop "present" always;
add_header X-Simert-WAF-Upstream-Status $upstream_status always;
