# The Keycloak username lookup accepts an email in its last path segment.
# A .com email suffix is not a file request, but CRS 920440 treats it as a
# restricted .com executable extension. Exclude only that rule for the two
# exact lookup routes, and only when the final segment looks like an email.
# All other CRS rules, including anomaly evaluation, remain active.
SecRule REQUEST_FILENAME "@rx ^/api/simert/api/keycloak/find-by-username(-municipality)?/[^/?@]+@[^/?@]+\.com$" \
    "id:100100,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:lowercase,ctl:ruleRemoveById=920440"

# El operador adjunta las fotos de la bitacora como URLs de Alfresco dentro del
# cuerpo. Para CRS una URL que viaja como DATO tiene la forma de un ataque RFI
# ("descargate esto de ..."), y la bloqueaba con 403: el cliente recibia la
# pagina HTML de nginx y la encolaba como "No pudo ser enviado".
#
# Se excluyen las dos reglas RFI que pueden marcar esas URLs, porque el host de
# Alfresco no es estable y la regla que salta depende de su forma:
#
#   931100  URL cuyo host es una IP. Es la que bloquea hoy, porque este
#           despliegue sirve Alfresco por IP (http://IP/alfresco/...).
#   931130  URL apuntando a un host distinto al de la peticion, dominios
#           incluidos. Hoy no salta porque es de nivel de paranoia 2 y el WAF
#           corre en nivel 1 (BLOCKING_PARANOIA=1), pero saltaria con dominio
#           si algun dia se sube el nivel.
#
# Excluir solo una dejaria el arreglo dependiendo de si Alfresco responde por
# IP o por dominio ese dia.
#
# El alcance es deliberadamente estrecho: solo estas dos reglas y solo en la
# ruta que recibe esas URLs. El resto de CRS y la evaluacion de anomalia siguen
# activos en toda la API, esta ruta incluida.
#
# Arreglo de fondo: que el cuerpo lleve el id del nodo de Alfresco y no la URL
# completa, componiendola quien la necesite. Sin URL en los datos no hay nada
# que marcar y esta exclusion sobra.
SecRule REQUEST_FILENAME "@rx ^/api/simert/client/operator/create-incident(/|$)" \
    "id:100101,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:lowercase,ctl:ruleRemoveById=931100,ctl:ruleRemoveById=931130"
