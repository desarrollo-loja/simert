# ==========================================================================
# SonarQube / SonarCloud scanner configuration for parking_simert (NestJS)
#
# Run locally with:
#   sonar-scanner -Dsonar.host.url=<URL> -Dsonar.token=<TOKEN>
#
# Do NOT hardcode the token here. Pass sonar.host.url / sonar.token via the
# CLI or CI environment variables (SONAR_HOST_URL / SONAR_TOKEN).
# ==========================================================================

# --- Project identity -----------------------------------------------------
sonar.projectKey=parking_simert
sonar.projectName=parking_simert
sonar.projectVersion=0.0.1

# For SonarCloud, also uncomment and set your organization:
# sonar.organization=<your-organization>
# sonar.host.url=https://sonarcloud.io

# --- Sources & tests ------------------------------------------------------
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts

# --- Encoding & language settings -----------------------------------------
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json

# --- Coverage (generated by: npm run test:cov) ----------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Exclusions -----------------------------------------------------------
# Build output, deps, coverage and generated/boilerplate files. Mirrors the
# Jest collectCoverageFrom rules: DTOs, entities and *.module.ts add no
# analysable logic, so they only add noise to the quality gate.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  submodule/**,\
  **/*.module.ts,\
  **/dto/**,\
  **/entities/**,\
  **/*.js

# Exclude spec files from the duplication metric (test scaffolding repeats).
sonar.cpd.exclusions=**/*.spec.ts

# Files that are tests should not also be scanned as production coverage targets.
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  test/**,\
  **/*.module.ts,\
  **/dto/**,\
  **/entities/**,\
  src/main.ts

# ==========================================================================
# Criterio Anexo 2 -> SonarQube rules
#
# IMPORTANT: SonarQube rule activation and severity are configured SERVER-SIDE
# in Administration > Quality Profiles, NOT in this file. The mapping below
# lists exactly which built-in TypeScript rules to activate (and at which
# severity) so the profile matches the Anexo 2 matrix.
#
#   NOMENCLATURA
#     Clases en PascalCase ............... typescript:S101   (MINOR)
#     camelCase variables / parametros ... typescript:S117   (MINOR)
#     camelCase metodos .................. typescript:S100   (MINOR)
#
#   ESTRUCTURA / SOLID
#     Acoplamiento de clase (SRP/DIP) .... typescript:S1200  (MAJOR)
#     Archivos demasiado largos .......... typescript:S104   (MAJOR)
#     Funciones demasiado largas (SRP) ... typescript:S138   (MAJOR)
#     Demasiados metodos por clase ....... typescript:S1448  (MAJOR)
#
#   COMPLEJIDAD
#     Complejidad cognitiva .............. typescript:S3776  (MAJOR)
#     Complejidad ciclomatica ............ typescript:S1541  (MAJOR)
#
# Criterios cubiertos por ESLint/Prettier (NO por Sonar):
#     Indentacion 2 espacios / operadores ... prettier/prettier (ESLint)
#     Documentacion @param / @returns ....... jsdoc/require-param, jsdoc/require-returns
#     Lineas vacias / separacion funciones .. ESLint (no-multiple-empty-lines, padding-*)
# ==========================================================================
